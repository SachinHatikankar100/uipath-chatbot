[project]
name = "uipath-monitoring-chatbot"
version = "0.1.0"
description = "A GenAI chatbot for monitoring UiPath Orchestrator jobs and queues"
readme = "README.md"
requires-python = ">=3.11"

license = { text = "MIT" }


dependencies = [
"requests==2.33.1",
"pydantic==2.13.3",
"streamlit==1.56.0",
"python-dotenv==1.2.2",
"tabulate==0.9.0",
"langchain==1.2.15",
"langchain-community==0.4.1",
"langgraph==1.1.8",
"langchain_core==1.3.2",
"langchain-tavily==0.2.18",
"langchain-openai==1.2.1",
"nemoguardrails==0.21.0"

]

authors = [
    { name = "Sachin Hatikankan" }
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["chatbot", "evaluate"]